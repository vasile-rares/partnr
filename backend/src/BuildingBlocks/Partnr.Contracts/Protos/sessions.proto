syntax = "proto3";

option csharp_namespace = "Partnr.Contracts.Sessions";

package partnr.sessions.v1;

// Served by whoever owns the accounts and the session cookie (the Core service).
// The gateway asks on every request that carries a session cookie.
service SessionValidation {
  // The browser's Cookie header travels as the call's "cookie" metadata (an HTTP/2 header), so the server validates it
  // exactly as it would on a direct request, including the check that the account is still there.
  rpc Validate (ValidateRequest) returns (ValidateReply);
}

message ValidateRequest {}

message ValidateReply {
  bool valid = 1;
  // The account's id; set when valid.
  string user_id = 2;
}
