name: partnr

# Local development infrastructure. The values come from .env (copy .env.example); without it the defaults below apply.
# Every port is bound to the loopback addresses only (127.0.0.1 and ::1): these services have weak local credentials and must not be reachable
# from the network. Both are needed: "localhost" resolves to ::1 first, and a client that finds nothing there loses seconds before it tries IPv4.
# `docker compose up -d --wait` returns once every service with a health check is healthy.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11
    container_name: partnr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partnr}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1q2w3e}
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # Catches every email the services send in development (nothing reaches real inboxes). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: partnr-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "[::1]:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI and API
      - "[::1]:8025:8025" # web UI and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # S3-compatible object storage for uploaded files (RustFS; MinIO no longer publishes images). S3 API: http://localhost:9000, console: http://localhost:9001
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: partnr-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "[::1]:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # console
      - "[::1]:9001:9001" # console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # Message broker for the events between services (Wolverine). AMQP on :5672, management UI on http://localhost:15672.
  # No volume: the events that matter are kept in the outbox in Postgres, and the queues are created again at startup.
  # (The default "guest" user only works from localhost, and through Docker's port mapping the connection does not look like that.)
  rabbitmq:
    image: rabbitmq:4.4.1-management
    container_name: partnr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-partnr}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-partnr}
    ports:
      - "127.0.0.1:5672:5672" # AMQP
      - "[::1]:5672:5672" # AMQP
      - "127.0.0.1:15672:15672" # management UI
      - "[::1]:15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    logging: *default-logging

  # Logs, metrics and traces of the backend services (the Aspire dashboard, standalone). UI: http://localhost:18888, no login (local only).
  # The services send their telemetry over OTLP to :4317 when OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 is set (the F5 profiles do it).
  # No volume: what it shows is kept in memory, so it starts empty after a restart. No health check: the image has no shell.
  # Optional: it starts through the "observability" profile, which .env turns on (COMPOSE_PROFILES); remove it there to leave it out.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    container_name: partnr-aspire-dashboard
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888" # web UI
      - "[::1]:18888:18888" # web UI
      - "127.0.0.1:4317:18889" # OTLP over gRPC
      - "[::1]:4317:18889" # OTLP over gRPC
    logging: *default-logging

networks:
  default:
    name: partnr

volumes:
  postgres-data:
    name: partnr-postgres-data
  rustfs-data:
    name: partnr-rustfs-data
