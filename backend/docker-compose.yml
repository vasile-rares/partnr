services:
  postgres:
    image: postgres:17
    container_name: partnr-postgres
    environment:
      POSTGRES_DB: partnr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1q2w3e
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Catches every email the API sends in development (nothing reaches real inboxes). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: partnr-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI and API

  # S3-compatible object storage for uploaded files (RustFS; MinIO no longer publishes images). S3 API: http://localhost:9000, console: http://localhost:9001
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: partnr-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - rustfs-data:/data

  # Message broker for the events between services (Wolverine). AMQP on :5672, management UI on http://localhost:15672 (partnr / partnr).
  # No volume: the events that matter are kept in the outbox in Postgres, and the queues are created again at startup.
  # (The default "guest" user only works from localhost, and through Docker's port mapping the connection does not look like that.)
  rabbitmq:
    image: rabbitmq:4.4.1-management
    container_name: partnr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: partnr
      RABBITMQ_DEFAULT_PASS: partnr
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI

volumes:
  postgres-data:
  rustfs-data:
