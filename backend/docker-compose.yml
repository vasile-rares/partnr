services:
  postgres:
    image: postgres:17
    container_name: client-portal-postgres
    environment:
      POSTGRES_DB: client_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Catches every email the API sends in development (nothing reaches real inboxes). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: client-portal-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI and API

  # S3-compatible object storage for uploaded files (RustFS; MinIO no longer publishes images). S3 API: http://localhost:9000, console: http://localhost:9001
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: client-portal-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  rustfs-data:
